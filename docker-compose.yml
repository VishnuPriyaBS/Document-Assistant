services:
  docai:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${DOCAI_PORT:-3000}:3000"

    env_file:
      - .env.local

    environment:
      NODE_ENV: production

    volumes:
      - docai_documents:/app/.local-documents

    restart: unless-stopped

volumes:
  docai_documents: